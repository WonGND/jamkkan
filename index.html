<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잠깐만 설치</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f4f6">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--bg:#f2f4f6;--card:#fff;--fill:#f2f4f6;--fg:#191f28;--sub:#6b7684;--muted:#8b95a1;--primary:#3182f6;--weak-bg:#e8f3ff;--weak-fg:#1b64da;--red:#f04452}
@media (prefers-color-scheme: dark){:root{--bg:#101114;--card:#1d1f24;--fill:#2b2f36;--fg:#f2f4f6;--sub:#a0a8b2;--muted:#848d97;--weak-bg:rgba(49,130,246,.18);--weak-fg:#90c2ff}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Toss Product Sans",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 16px 40px}
h1{font-size:26px;line-height:35px;font-weight:700;padding:0 8px}
.lead{font-size:16px;color:var(--sub);margin-top:8px;padding:0 8px}
.card{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:20px;margin-top:12px;text-decoration:none;color:inherit;transition:transform .1s ease}
.card:active{transform:scale(.98)}
.card img{width:52px;height:52px;border-radius:14px;flex:none}
.card b{display:block;font-size:17px}
.card span{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.how{background:var(--card);border-radius:20px;padding:20px;margin-top:24px}
.how h2{font-size:15px;font-weight:700}
.how ol{padding-left:18px;margin-top:8px;font-size:14px;color:var(--sub)}
.how li+li{margin-top:4px}
</style>
</head>
<body>
<main>
  <h1>잠깐만 설치하기</h1>
  <p class="lead">안드로이드 앱 하나만 설치하면 돼요.</p>
  <a class="card" href="https://github.com/WonGND/jamkkan/releases/latest/download/jamkkan.apk"><img src="icons/icon-192.png" alt=""><div><b>잠깐만 앱 받기 (APK)</b><span>쇼핑·배달·결제 앱이 켜지면 잠깐만이 먼저 켜져요</span></div></a>
  <div class="how">
    <h2>설치하는 법</h2>
    <ol>
      <li>위 카드를 눌러 jamkkan.apk 를 받아요</li>
      <li>받은 파일을 열고 ‘설치’를 눌러요. 처음이면 ‘이 출처 허용’을 켜야 해요</li>
      <li>잠깐만을 열고 설정 → ‘앱과 연결하기’에서 앱 고르기와 권한 허용을 해요</li>
    </ol>
  </div>
</main>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
