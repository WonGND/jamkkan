name: Android APK

# android/ 나 웹 화면(app/index.html)이 바뀌면 APK를 새로 빌드해서 GitHub Release에 올림.
# 휴대폰에서 받는 고정 주소: https://github.com/WonGND/jamkkan/releases/latest/download/jamkkan.apk
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/index.html'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests (앱 감지 로직)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Report failed tests
        if: failure()
        run: |
          for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  msg = (fl.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title=테스트 실패::{tc.get('name')} - {msg}")
          PY
          done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jamkkan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jamkkan-apk
          path: jamkkan.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          TAG="apk-v${VER}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" jamkkan.apk \
            --title "잠깐만 앱 ${VER} (빌드 ${GITHUB_RUN_NUMBER})" \
            --notes "휴대폰에서 jamkkan.apk 를 눌러 받은 뒤 설치하세요. 커밋: ${GITHUB_SHA::7}" \
            --latest
