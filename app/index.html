<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>잠깐만</title>
<meta name="description" content="사기 전에 한 번 더 생각하게 돕는 지출 브레이크">
<meta id="themeColor" name="theme-color" content="#f2f4f6">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
/* 디자인 토큰: 토스 DESIGN.md(TDS Mobile)의 색·버튼 규격을 따름.
   다크 모드 값, 카드 반경 20px, 시트 반경 24px은 로컬 확장값. */
:root{
  --bg:#f2f4f6; --card:#ffffff; --sheet:#ffffff;
  --fill:#f2f4f6; --fill-press:#e5e8eb;
  --fg:#191f28; --fg2:#333d4b; --body:#4e5968; --sub:#6b7684; --muted:#8b95a1; --faint:#b0b8c1;
  --border:#e5e8eb; --track:#e5e8eb;
  --primary:#3182f6; --primary-press:#2272eb;
  --weak-bg:#e8f3ff; --weak-fg:#1b64da;
  --danger:#e42939; --danger-weak:#ffeeee;
  --green-fg:#029359; --green-weak:#f0faf6;
  --dim:rgba(0,0,0,.4); --toast:#333d4b;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101114; --card:#1d1f24; --sheet:#24272d;
    --fill:#2b2f36; --fill-press:#363b43;
    --fg:#f2f4f6; --fg2:#e5e8eb; --body:#c3c9d0; --sub:#a0a8b2; --muted:#848d97; --faint:#6b7480;
    --border:#30343b; --track:#353a42;
    --primary:#3182f6; --primary-press:#4593fc;
    --weak-bg:rgba(49,130,246,.18); --weak-fg:#90c2ff;
    --danger:#f66570; --danger-weak:rgba(240,68,82,.16);
    --green-fg:#3fd599; --green-weak:rgba(3,178,108,.16);
    --dim:rgba(0,0,0,.6); --toast:#3a3f47;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:"Toss Product Sans",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  background:var(--bg);color:var(--fg);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
:focus{outline:none}
button:focus-visible,input:focus-visible{box-shadow:0 0 0 1px #8ac0ff,0 0 0 3px #b8d9ff}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- 버튼 (TDS Mobile xlarge: 56px / 16px / 17px 600, 누르면 scale .96) ---------- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 20px;border-radius:16px;
  font-size:17px;font-weight:600;line-height:1;transition:transform .1s ease,background-color .1s ease;text-align:center}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.36;cursor:default}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active:not(:disabled){background:var(--primary-press)}
.btn-weak{background:var(--weak-bg);color:var(--weak-fg)}
.btn-light{background:var(--fill);color:var(--fg2)}
.btn-light:active:not(:disabled){background:var(--fill-press)}
.btn-danger{background:var(--danger-weak);color:var(--danger)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.btn-row .btn.grow{flex:1.6}
.tbtn{display:block;margin:0 auto;padding:10px 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--sub);text-align:center}
.tbtn:active{background:var(--fill)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--sub)}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:24px;height:24px}

/* ---------- 홈 ---------- */
#app{max-width:480px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 8px 6px 20px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border-radius:20px;padding:24px 20px;margin:0 16px 12px}
.label{font-size:15px;font-weight:500;color:var(--sub)}
.big{font-size:30px;line-height:40px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.big.danger{color:var(--danger)}
.big.blue{color:var(--primary)}
.big.dim{color:var(--muted)}
.cap{font-size:13px;line-height:19.5px;color:var(--muted);margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--primary);transition:width .3s var(--ease)}
.bar i.over{background:var(--danger)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.qtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 12px;border-radius:16px;background:var(--fill);transition:transform .1s ease}
.qtile:active{transform:scale(.96);background:var(--fill-press)}
.qtile .emo{font-size:26px;line-height:1}
.qtile .lb{font-size:13px;font-weight:600;color:var(--body)}
.sec-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sec-head h2{font-size:17px;font-weight:700}
.sec-head .cnt{font-size:17px;font-weight:700;color:var(--primary)}
.empty{font-size:15px;color:var(--muted);padding:12px 0 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:12px}
button.row:active{background:var(--fill)}
.row .emo{font-size:22px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--fill);flex:none}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:none;text-align:right;font-size:15px;font-weight:600;color:var(--fg2)}
.row .r .due{color:var(--primary)}
.row .r small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:1px}
.more{display:flex;align-items:center;justify-content:space-between;width:calc(100% + 16px);margin:12px -8px -8px;padding:10px 8px;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub)}
.more:active{background:var(--fill)}
.more svg{width:18px;height:18px;transition:transform .2s ease}
.more.open svg{transform:rotate(90deg)}
.divider{height:1px;background:var(--border);margin:16px 0 8px}
.badge{display:inline-block;font-size:12px;font-weight:600;line-height:18px;padding:2px 7px;border-radius:6px;vertical-align:middle}
.badge.weak{background:var(--weak-bg);color:var(--weak-fg)}
.badge.green{background:var(--green-weak);color:var(--green-fg)}
.badge.grey{background:var(--fill);color:var(--sub)}
.score{display:flex;align-items:center;gap:12px;padding:10px 0}
.score .main{flex:1;min-width:0}
.score .t{font-size:15px;font-weight:600}
.score .s{font-size:13px;color:var(--muted);margin-top:1px}
.score .v{font-size:20px;font-weight:700;color:var(--primary)}
.score .v.dim{color:var(--faint)}
.foot{font-size:12px;color:var(--faint);text-align:center;padding:8px 24px 0}
.bottom-cta{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:480px;margin:0 auto;
  padding:20px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 32%)}

/* ---------- 전체 화면 페이지 ---------- */
.page{position:fixed;inset:0;z-index:20;background:var(--card);overscroll-behavior:contain;
  transform:translateX(100%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
.page.open{transform:none;visibility:visible;transition:transform .28s var(--ease)}
#pg-recheck{z-index:25;transform:translateY(100%)}
#pg-recheck.open{transform:none}
.pin{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.phead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;min-height:56px}
.phead .ttl{flex:1;font-size:17px;font-weight:600;text-align:center}
.phead .side{width:44px;flex:none;font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:8px 24px 24px;display:flex;flex-direction:column;overscroll-behavior:contain}
/* 내용이 길어도 버튼·입력칸이 눌려서 납작해지지 않게 */
.pbody>*{flex-shrink:0}
.pfoot{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.ptitle{font-size:26px;line-height:35px;font-weight:700;letter-spacing:-.01em}
.psub{font-size:16px;color:var(--sub);margin-top:6px}
.spacer{flex:1;min-height:16px}
.hero-input{width:100%;margin-top:32px;border:0;border-bottom:2px solid var(--border);background:none;padding:8px 0;font-size:24px;font-weight:600;border-radius:0;transition:border-color .15s ease}
.hero-input:focus{border-color:var(--primary);box-shadow:none}
.hero-input::placeholder{color:var(--faint)}
.amount{font-size:34px;line-height:46px;font-weight:700;margin-top:28px;letter-spacing:-.01em}
.amount.zero{color:var(--faint)}
.amount span{border-radius:8px;padding:0 4px;margin:0 -4px}
.amount.fresh span{background:var(--weak-bg)}
.work{font-size:16px;font-weight:600;color:var(--primary);margin-top:4px;min-height:24px}
.chips{display:flex;gap:8px;margin-top:20px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-size:14px;font-weight:600;color:var(--body)}
.chip:active{background:var(--fill-press)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);margin:12px -8px 0}
.key{height:58px;border-radius:14px;font-size:24px;font-weight:500;display:grid;place-items:center;color:var(--fg)}
.key:active{background:var(--fill)}
.key svg{width:26px;height:26px;color:var(--sub)}

/* 판단 카테고리 */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
.ctile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:124px;padding:18px 16px 16px;border-radius:16px;background:var(--fill);text-align:left;transition:transform .1s ease}
.ctile:active{transform:scale(.96);background:var(--fill-press)}
.ctile .emo{font-size:32px;line-height:1}
.ctile b{display:block;font-size:17px;font-weight:700;color:var(--fg)}
.ctile small{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}

/* 판단 질문 */
.jitem{background:var(--fill);border-radius:16px;padding:16px 18px}
.jitem .n{font-size:15px;font-weight:600;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jitem .p{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:2px}
.jitem .p b{font-size:20px;font-weight:700}
.steps{display:flex;gap:6px;margin-top:28px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.steps i.on{background:var(--primary)}
.qtitle{font-size:26px;line-height:35px;font-weight:700;margin-top:20px;letter-spacing:-.01em}
.qwrap{animation:qin .22s var(--ease)}
@keyframes qin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.ans-row{display:flex;gap:8px}
.ans{flex:1;height:64px;border-radius:16px;background:var(--fill);font-size:18px;font-weight:600;color:var(--fg);transition:transform .1s ease;text-align:center}
.ans:active{transform:scale(.96);background:var(--fill-press)}

/* 결과 */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.result .emo{font-size:56px;line-height:1}
.result h1{font-size:24px;line-height:33px;font-weight:700;margin-top:20px}
.result p{font-size:16px;color:var(--sub);margin-top:8px}
.result .jitem{width:100%;margin-top:28px;text-align:left}
.reason{font-size:14px;color:var(--sub);margin-top:10px}

/* ---------- 시트 ---------- */
.dim{position:fixed;inset:0;z-index:40;background:var(--dim);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s .2s}
.dim.open{opacity:1;visibility:visible;transition:opacity .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--sheet);border-radius:24px 24px 0 0;padding:12px 20px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 20px}
.stitle{font-size:22px;line-height:31px;font-weight:700}
.sdesc{font-size:15px;color:var(--sub);margin-top:6px}
.sheet .amount{margin-top:16px}
.sheet .btn-col{display:flex;flex-direction:column;gap:8px;margin-top:24px}

/* ---------- 설정 ---------- */
.group{font-size:13px;font-weight:600;color:var(--muted);margin:32px 0 4px}
.group:first-child{margin-top:8px}
.field{margin-top:14px}
.field>label,.flabel{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-bottom:6px}
.inbox{display:flex;align-items:center;height:52px;padding:0 16px;border-radius:12px;background:var(--fill);border:2px solid transparent;transition:border-color .15s ease,background-color .15s ease}
.inbox:focus-within{border-color:var(--primary);background:var(--card)}
.inbox input{flex:1;min-width:0;border:0;background:none;font-size:17px;font-weight:600;box-shadow:none}
.inbox input::placeholder{color:var(--faint);font-weight:500}
.inbox .unit{flex:none;margin-left:6px;color:var(--muted);font-weight:500}
.help{font-size:13px;line-height:19.5px;color:var(--muted);margin-top:6px}
.wage{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--weak-bg)}
.wage .k{font-size:14px;font-weight:500;color:var(--weak-fg)}
.wage .v{font-size:22px;font-weight:700;color:var(--weak-fg);margin-top:2px}
.wage .f{font-size:13px;color:var(--weak-fg);opacity:.8;margin-top:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--fill)}
.seg button{flex:1;height:40px;border-radius:9px;font-size:15px;font-weight:600;color:var(--sub);text-align:center}
.seg button.on{background:var(--card);color:var(--fg)}
.qedit{margin-top:12px;padding:16px;border-radius:16px;background:var(--fill)}
.qedit .qn{font-size:13px;font-weight:600;color:var(--muted)}
.qedit .inbox{background:var(--card);margin-top:8px;height:48px}
.qedit .inbox input{font-size:16px}
.qedit .two{display:flex;gap:8px;margin-top:8px}
.qedit .two>div{flex:1;min-width:0}
.qedit .two .flabel{font-size:12px;margin:0 0 4px 2px}
.ver{font-size:12px;color:var(--faint);text-align:center;margin-top:28px;padding-bottom:12px}

/* ---------- 브레이크 (루틴 전용 입구) ---------- */
#pg-brake{z-index:15;transform:none;opacity:0;transition:opacity .2s ease,visibility 0s .2s}
#pg-brake.open{opacity:1;visibility:visible;transition:opacity .2s ease}
.blabel{align-self:flex-start;font-size:13px;font-weight:600;color:var(--weak-fg);background:var(--weak-bg);padding:4px 10px;border-radius:8px}
.bstats{display:flex;gap:8px;margin-top:20px}
.bstats>div{flex:1;min-width:0;background:var(--fill);border-radius:16px;padding:14px 16px}
.bstats span{display:block;font-size:13px;color:var(--sub)}
.bstats b{display:block;font-size:19px;font-weight:700;margin-top:2px}
.bstats b.neg{color:var(--danger)}
.appgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.appchip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:14px 4px 12px;border-radius:16px;background:var(--fill);text-align:center;transition:transform .1s ease}
.appchip:active{transform:scale(.96);background:var(--fill-press)}
.appchip .emo{font-size:24px;line-height:1}
.appchip .nm{font-size:13px;font-weight:600;color:var(--body);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnote{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.bcenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px 40px}
.bcenter .emo{font-size:52px;line-height:1}
.bcenter h1{font-size:24px;line-height:33px;font-weight:700;margin-top:18px}
.bcenter p{font-size:16px;color:var(--sub);margin-top:8px}
.bcenter .hint{font-size:13px;color:var(--muted);margin-top:16px}

/* 앱 고르기 · 연결 가이드 */
.pickgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pick{height:38px;padding:0 14px;border-radius:19px;background:var(--fill);border:1.5px solid transparent;font-size:14px;font-weight:600;color:var(--body);text-align:center}
.pick.on{background:var(--weak-bg);color:var(--weak-fg);border-color:var(--primary)}
.sheet .group{margin-top:24px}
.gstep{display:flex;gap:14px;margin-top:28px}
.gstep .n{flex:none;width:26px;height:26px;border-radius:13px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.gstep .n.done{background:var(--green-fg)}
.gstep .c{flex:1;min-width:0}
.gstep h3{font-size:17px;line-height:26px;font-weight:700}
.gstep p,.gstep li{font-size:14px;line-height:21px;color:var(--sub)}
.gstep p{margin-top:4px}
.gstep ol{padding-left:18px;margin-top:6px}
.gstep li+li{margin-top:4px}
.gstep li b{color:var(--fg2)}
.gstep .btn{height:44px;border-radius:12px;font-size:15px;margin-top:12px}
.urlbox{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--fill);font-size:13px;color:var(--fg2);word-break:break-all;user-select:all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--fill);color:var(--body)}
.logrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--sub)}
.logrow b{font-weight:600;color:var(--fg2)}

/* ---------- 토스트 ---------- */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;max-width:448px;margin:0 auto;
  display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-radius:16px;background:var(--toast);color:#fff;font-size:15px;font-weight:500;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s var(--ease)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{flex:none;color:#90c2ff;font-weight:600;padding:4px 6px;margin:-4px -6px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important}
}
</style>
</head>
<body>
<noscript><p style="padding:24px">이 앱은 자바스크립트가 필요해요.</p></noscript>

<div id="app">
  <header class="topbar">
    <div class="brand">잠깐만</div>
    <button class="icon-btn" data-act="openSettings" aria-label="설정">

  catch (_) { toast('저장하지 못했어요. 저장 공간을 확인해 주세요'); }

/* ---------- 계산 ---------- */
function hourlyWage() {
  const s = S.settings;
  const h = (Number(s.workHours) || 0) + (Number(s.commuteHours) || 0);
  if (!s.monthlyNet || h <= 0) return 0;
  return s.monthlyNet / (h * WEEKS_PER_MONTH);
}
function workLabel(price) {
  const hw = hourlyWage();
  if (!hw || !price) return '';
  const hrs = price / hw;
  if (hrs < 1) return `약 ${Math.max(1, Math.round(hrs * 60))}분`;
  const r = hrs < 10 ? Math.round(hrs * 10) / 10 : Math.round(hrs);
  let out = `약 ${r}시간`;
  const dayH = ((Number(S.settings.workHours) || 0) + (Number(S.settings.commuteHours) || 0)) / 5;
  if (dayH > 0 && hrs >= dayH * 1.5) {
    const days = hrs / dayH;
    out += ` · 출근 ${days < 10 ? Math.round(days * 10) / 10 : Math.round(days)}일`;
  }
  return out;
}
const qCount = (cat) => jcat(cat).q.length;
function qLabel(cat, i, k) {
  const def = jcat(cat).q[i] || {};
  const u = ((S.settings.cats[cat] || {}).q || [])[i] || {};
  return String(u[k] || '').trim() || def[k] || '';
}
function questionText(cat, i, price) {
  let t = qLabel(cat, i, 'text');
  const w = workLabel(price);
  const hours = w ? w.split(' · ')[0] : '';
  if (t.includes('{남은돈}')) {
    const lim = S.settings.weeklyLimit;
    if (lim > 0) {
      const { s, e } = thisWeek();
      const rem = lim - sum(spendsBetween(s, e), 'amount') - price;
      t = t.split('{남은돈}').join(rem >= 0 ? `이번 주 ${won(rem)} 남아` : `이번 주 한도를 ${won(-rem)} 넘어`);
    } else {
      return hours ? `${hours} 일한 돈 써도 괜찮아?` : '이 돈 써도 괜찮아?';
    }
  }
  if (t.includes('{시간}')) {
    if (!hours) return '이 가격만큼 가치 있어?';
    t = t.split('{시간}').join(hours);
  }
  return t;
}
function weekStartOf(ts) {
  const d = new Date(ts); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - S.settings.weekStart + 7) % 7));
  return d;
}
const wkey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function thisWeek() {
  const s = weekStartOf(Date.now());
  const e = new Date(s); e.setDate(e.getDate() + 7);
  return { s, e };
}
function spendsBetween(s, e) { return S.spends.filter((x) => x.at >= +s && x.at < +e); }
const sum = (arr, k) => arr.reduce((a, x) => a + (x[k] || 0), 0);
function snapshotWeekLimit() {
  const { s } = thisWeek();
  if (S.settings.weeklyLimit > 0) S.weekLimits[wkey(s)] = S.settings.weeklyLimit;
}
function weekScore() {
  const startTs = S.settings.startedAt;
  if (!startTs) return { done: 0, ok: 0 };
  const cur = weekStartOf(Date.now());
  let done = 0, ok = 0;
  for (let d = weekStartOf(startTs); d < cur; d.setDate(d.getDate() + 7)) {
    const e = new Date(d); e.setDate(e.getDate() + 7);
    const lim = S.weekLimits[wkey(d)] ?? S.settings.weeklyLimit;
    if (!lim) continue;
    done++;
    if (sum(spendsBetween(d, e), 'amount') <= lim) ok++;
  }
  return { done, ok };
}
function waitScore() {
  const w = S.items.filter((i) => i.waited);
  const decided = w.filter((i) => i.status !== 'waiting');
  return {
    decided: decided.length,
    skipped: decided.filter((i) => i.status === 'passed').length,
    pending: w.length - decided.length,
  };
}
const passedItems = () => S.items.filter((i) => i.status === 'passed');
const waitingItems = () => S.items.filter((i) => i.status === 'waiting').sort((a, b) => a.waitUntil - b.waitUntil);
const dueItems = () => waitingItems().filter((i) => i.waitUntil <= Date.now());
const catOf = (id) => CATS.find((c) => c.id === id) || CATS[3];

/* ---------- 레이어(페이지·시트) + 안드로이드 뒤로 가기 ---------- */
const layers = [];
let skipPop = false;
const BR = { shown: false, mode: 'ask', title: '', src: LAUNCH.label || LAUNCH.pkg ? { pkg: LAUNCH.pkg, label: LAUNCH.label } : null }; // 브레이크 화면 상태 (레이어가 아니라 '바닥' 화면이라 뒤로 가기로 바로 원래 앱으로 감)
const LAYER_EL = { judge: '#pg-judge', recheck: '#pg-recheck', settings: '#pg-settings', guide: '#pg-guide', sheet: '#sheet' };
function syncInert() {
  $('#app').inert = layers.length > 0 || BR.shown;
  $('#pg-brake').inert = layers.length > 0;
  for (const id of ['judge', 'recheck', 'settings', 'guide']) {
    const top = layers[layers.length - 1];
    $(LAYER_EL[id]).inert = layers.includes(id) && top !== id && !(top === 'sheet' && layers[layers.length - 2] === id);
  }
}
function showLayer(id, on) {
  const el = $(LAYER_EL[id]);
  // 페이지는 연 순서대로 위에 쌓이게 (시트·토스트는 CSS의 더 높은 값 유지)
  if (id !== 'sheet') el.style.zIndex = on ? String(20 + Math.max(0, layers.indexOf(id))) : '';
  el.classList.toggle('open', on);
  if (id === 'sheet') $('#dim').classList.toggle('open', on);
  syncInert();
  updateThemeColor();
}
function openLayer(id) {
  if (!layers.includes(id)) layers.push(id);
  showLayer(id, true);
  if (!(history.state && history.state.g)) history.pushState({ g: 1 }, '');
}
function closeLayer(id) {
  const i = layers.lastIndexOf(id);
  if (i < 0) return;
  layers.splice(i, 1);
  showLayer(id, false);
  if (!layers.length && history.state && history.state.g) { skipPop = true; history.back(); }
}
function handleBack() {
  const top = layers[layers.length - 1];
  if (top === 'sheet') closeSheet();
  else if (top === 'judge') judgeBack();
  else if (top === 'recheck') closeLayer('recheck');
  else if (top === 'settings') settingsBack();
  else if (top === 'guide') closeGuide();
}
window.addEventListener('popstate', () => {
  if (skipPop) { skipPop = false; if (layers.length) history.pushState({ g: 1 }, ''); return; }
  if (!layers.length) return;
  handleBack();
  if (layers.length) history.pushState({ g: 1 }, '');
});
function updateThemeColor() {
  const pageOpen = layers.some((l) => l !== 'sheet') || BR.shown;
  const v = getComputedStyle(document.documentElement).getPropertyValue(pageOpen ? '--card' : '--bg').trim();
  if (v) $('#themeColor').setAttribute('content', v);
}

/* ---------- 토스트 ---------- */
let toastTimer = null, toastFn = null;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button data-act="toastAct">${esc(action.label)}</button>` : '');
  toastFn = action ? action.fn : null;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 4500 : 2800);
}
function hideToast() { clearTimeout(toastTimer); $('#toast').classList.remove('show'); toastFn = null; }

/* ---------- 홈 ---------- */
const UI = { showSpends: false };
function renderHome() {
  const st = S.settings;
  const { s, e } = thisWeek();
  const week = spendsBetween(s, e).sort((a, b) => b.at - a.at);
  const spent = sum(week, 'amount');
  const lim = st.weeklyLimit;
  const over = lim > 0 && spent > lim;
  const pct = lim > 0 ? Math.min(100, (spent / lim) * 100) : 0;

  // 0) 연결 안내 (본 앱에서만)
  let connect = '';
  if (ENTRY === 'app' && st.onboarded) {
    if (!st.apps.length) {
      connect = `<section class="card"><div class="sec-head"><h2>쇼핑앱을 열면 잠깐만이 먼저 켜지게</h2></div>
        <div class="cap" style="margin-top:2px">결제·쇼핑·배달 앱과 연결해 두면 사기 직전에 한 번 더 물어봐요</div>
        <button class="btn btn-weak" style="margin-top:16px;height:48px;border-radius:14px;font-size:16px" data-act="openGuide">앱과 연결하기</button></section>`;
    } else if (!S.brake.log.length) {
      connect = `<section class="card"><div class="sec-head"><h2>브레이크가 아직 한 번도 안 켜졌어요</h2></div>
        <div class="cap" style="margin-top:2px">${Platform.native ? '권한을 허용하고, 연결한 앱을 열어 확인해 보세요' : '루틴 연결을 마무리하고, 연결한 앱을 열어 확인해 보세요'}</div>
        <button class="btn btn-weak" style="margin-top:16px;height:48px;border-radius:14px;font-size:16px" data-act="openGuide">연결 확인하기</button></section>`;
    }
  }

  // 1) 이번 주
  let html = `<section class="card">
    <div class="label">이번 주 남은 돈</div>`;
  if (lim > 0) {
    html += `<div class="big num ${over ? 'danger' : ''}">${over ? '−' + won(spent - lim) : won(lim - spent)}</div>
      <div class="bar"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div>
      <div class="cap num">${won(lim)} 중 ${won(spent)} 썼어요 · ${DAYS[st.weekStart]}요일에 새로 시작</div>`;
  } else {
    html += `<div class="big dim">한도를 정해 주세요</div>
      <div class="cap num">이번 주 ${won(spent)} 썼어요</div>
      <button class="btn btn-weak" style="margin-top:16px;height:48px;border-radius:14px;font-size:16px" data-act="openSettings">주간 한도 정하기</button>`;
  }
  html += `<div class="quick">${CATS.map((c) => `<button class="qtile" data-act="quick" data-cat="${c.id}"><span class="emo">${c.emoji}</span><span class="lb">${c.label}</span></button>`).join('')}</div>`;
  if (week.length) {
    html += `<button class="more ${UI.showSpends ? 'open' : ''}" data-act="toggleSpends"><span>이번 주 기록 ${week.length}건</span>${ICON.right}</button>`;
    if (UI.showSpends) {
      html += `<div style="margin-top:4px">${week.map((x) => {
        const c = catOf(x.cat);
        return `<button class="row" data-act="spendItem" data-id="${x.id}"><span class="emo">${c.emoji}</span><span class="main"><span class="t" style="display:block">${c.label}</span><span class="s" style="display:block">${DAYS[new Date(x.at).getDay()]} ${timeLabel(x.at)}</span></span><span class="r num">${won(x.amount)}</span></button>`;
      }).join('')}</div>`;
    }
  }
  html += `</section>`;

  html += connect;

  // 2) 대기함
  const waits = waitingItems();
  html += `<section class="card">
    <div class="sec-head"><h2>대기함</h2>${waits.length ? `<span class="cnt">${waits.length}</span>` : ''}</div>`;
  if (!waits.length) html += `<div class="empty">기다리는 물건이 없어요</div>`;
  else html += waits.map((it) => {
    const left = it.waitUntil - Date.now();
    const right = left <= 0 ? `<span class="due">지금 결정</span>` : `<span>${remainLabel(left)}</span>`;
    return `<button class="row" data-act="waitItem" data-id="${it.id}"><span class="emo">${jcat(it.cat).emoji}</span><span class="main"><span class="t" style="display:block">${esc(it.name)}</span><span class="s num" style="display:block">${won(it.price)}${workLabel(it.price) ? ' · ' + workLabel(it.price).split(' · ')[0] : ''}</span></span><span class="r">${right}</span></button>`;
  }).join('');
  html += `</section>`;

  // 3) 참은 돈
  const passed = passedItems();
  const saved = sum(passed, 'price');
  const w = workLabel(saved);
  html += `<section class="card">
    <div class="label">지금까지 참은 돈</div>
    <div class="big num ${saved ? 'blue' : 'dim'}">${won(saved)}</div>
    <div class="cap">${passed.length ? `${passed.length}번 참았어요${w ? ' · ' + w.split(' · ')[0] + ' 일한 돈' : ''}` : '안 사기로 하면 여기에 쌓여요'}</div>
  </section>`;

  // 4) 성적 (M3 성공 기준 두 숫자)
  const ws = waitScore(), wk = weekScore();
  html += `<section class="card">
    <div class="sec-head"><h2>잠깐만 성적</h2></div>
    <div class="score"><div class="main"><div class="t">대기함에서 안 산 비율</div>
      <div class="s">${ws.decided ? `결정한 ${ws.decided}개 중 ${ws.skipped}개를 안 샀어요` : '대기함에서 결정한 물건이 아직 없어요'}${ws.pending ? ` · 기다리는 중 ${ws.pending}개` : ''}</div></div>
      <div class="v num ${ws.decided ? '' : 'dim'}">${ws.decided ? Math.round((ws.skipped / ws.decided) * 100) + '%' : '–'}</div></div>
    <div class="score"><div class="main"><div class="t">주간 한도 지킨 주</div>
      <div class="s">${wk.done ? `지난 ${wk.done}주 중 ${wk.ok}주를 지켰어요` : '첫 주가 끝나면 집계돼요'}</div></div>
      <div class="v num ${wk.done ? '' : 'dim'}">${wk.done ? `${wk.ok}/${wk.done}` : '–'}</div></div>
  </section>`;

  // 5) 판단 기록
  const recs = S.items.filter((i) => i.status !== 'waiting').sort((a, b) => (b.decidedAt || 0) - (a.decidedAt || 0)).slice(0, 8);
  if (recs.length) {
    html += `<section class="card"><div class="sec-head"><h2>판단 기록</h2></div>` +
      recs.map((it) => `<button class="row" data-act="recItem" data-id="${it.id}"><span class="emo">${jcat(it.cat).emoji}</span><span class="main"><span class="t" style="display:block">${esc(it.name)}</span><span class="s" style="display:block">${whenLabel(it.decidedAt)}${it.src ? ' · ' + esc(it.src) : ''}${it.waited ? ' · 기다린 뒤' : ''}</span></span><span class="r num">${won(it.price)}<small>${it.status === 'passed' ? '<span class="badge green">참았어요</span>' : '<span class="badge grey">샀어요</span>'}</small></span></button>`).join('') +
      `</section>`;
  }
  html += `<p class="foot">기록은 이 휴대폰에만 저장돼요</p>`;
  $('#home').innerHTML = html;
}

/* ---------- 키패드 ---------- */
let PAD = null; // {obj, max, render}
function keypadHTML() {
  return `<div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'del'].map((k) =>
    `<button class="key num" data-act="key" data-k="${k}" aria-label="${k === 'del' ? '지우기' : k}">${k === 'del' ? ICON.del : k}</button>`).join('')}</div>`;
}
function pressKey(k) {
  if (!PAD) return;
  const o = PAD.obj, max = PAD.max;
  if (k === 'del') { o.value = o.fresh ? 0 : Math.floor(o.value / 10); o.fresh = false; }
  else if (k === 'clr') { o.value = 0; o.fresh = false; }
  else {
    const v = o.fresh ? 0 : o.value;
    o.fresh = false;
    const nv = k === '00' ? v * 100 : v * 10 + Number(k);
    o.value = nv <= max ? nv : v;
  }
  PAD.render();
}
function addChip(n) {
  if (!PAD) return;
  PAD.obj.value = Math.min(PAD.max, PAD.obj.value + n);
  PAD.obj.fresh = false;
  PAD.render();
}
function amountHTML(o) {
  return `<div class="amount num ${o.value ? '' : 'zero'} ${o.fresh && o.value ? 'fresh' : ''}"><span>${won(o.value)}</span></div>`;
}
// 지우기 길게 누르면 전체 삭제
let delTimer = null;
document.addEventListener('pointerdown', (e) => {
  const k = e.target.closest('[data-k="del"]');
  if (!k) return;
  delTimer = setTimeout(() => { delTimer = 'fired'; pressKey('clr'); buzz(); }, 500);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => document.addEventListener(t, () => { if (delTimer && delTimer !== 'fired') clearTimeout(delTimer); }));

function focusName() { const inp = $('#jName'); if (inp) inp.focus(); }
function judgeBack() {
  if (!J) return closeLayer('judge');
  if (J.step === 'cat' || J.step === 'passed') return closeLayer('judge');
  if (J.step === 'name') { J.step = 'cat'; document.activeElement && document.activeElement.blur(); renderJudge(); return; }
  if (J.step === 'price') { J.step = 'name'; renderJudge(); return; }
  if (J.step === 'q') {
    if (J.qi === 0) J.step = 'price';
    else { J.qi--; J.answers.pop(); }
    renderJudge(); return;
  }
  if (J.step === 'result') {
    J.answers.pop();
    J.qi = J.answers.length;
    J.failIdx = null;
    J.step = 'q';
    renderJudge();
  }
}
function judgeAnswer(pass) {
  const now = Date.now();
  if (now - ansLock < 250) return;
  ansLock = now;
  buzz();
  J.answers.push(pass);
  if (!pass) { J.failIdx = J.qi; J.step = 'result'; }
  else if (J.qi < qCount(J.cat) - 1) J.qi++;
  else { J.failIdx = null; J.step = 'result'; }
  renderJudge();
}
// 음식처럼 주간 지출에 들어가는 카테고리는 산 순간 소액 기록에도 함께 넣음
function recordWeekly(it) {
  const w = jcat(it.cat).weekly;
  if (!w) return;
  S.spends = S.spends.filter((x) => x.itemId !== it.id);
  S.spends.push({ id: uid(), cat: w, amount: it.price, at: Date.now(), itemId: it.id });
}
function addItem(status) {
  const now = Date.now();
  const it = {
    id: uid(), cat: J.cat, src: J.src || '', name: J.name.trim(), price: J.pad.value, at: now, status,
    waited: status === 'waiting',
    waitUntil: status === 'waiting' ? now + catWait(J.cat) * 60000 : null,
    decidedAt: status === 'waiting' ? null : now,
    failQ: J.failIdx, answers: J.answers.slice(), postponed: 0,
  };
  S.items.push(it);
  if (status === 'bought') recordWeekly(it);
  save();
  return it;
}

// 브레이크 입구가 열리거나 다시 앞으로 올 때
function onBrakeOpen() {
  if (ENTRY !== 'brake' || layers.length) return; // 판단 중이면 그대로 둠
  const now = Date.now();
  // 웹(루틴)일 때만: 다시 묻지 않는 시간·반복 실행 감지. 네이티브는 앱마다 따로 이 규칙을 지킴(docs/NATIVE.md)
  if (!Platform.native && S.brake.loopUntil && now < S.brake.loopUntil) { showBrake('loop'); return; }
  if (!Platform.native && S.brake.lastPass && now - S.brake.lastPass < cooldownMs()) {
    // 다른 일 없이 '바로 넘김'만 1분 안에 연달아 쌓이면 루틴이 반복 실행되는 것으로 봄
    let recentSkips = 0;
    for (const x of S.brake.log) { if (x.k !== 'skip' || now - x.t > 60000) break; recentSkips++; }
    if (recentSkips >= 2) { // 세 번째로 되돌아옴 → 멈추고 안내
      S.brake.loopUntil = now + cooldownMs();
      brakeLog('loop');
      showBrake('loop');
      return;
    }
    brakeLog('skip');
    showBrake('skip');
    closeApp();
    return;
  }
  brakeLog('open');
  showBrake('ask');
  maybeRecheck();
}
function brakeFinish(title) {
  if (ENTRY !== 'brake') return;
  S.brake.lastPass = Date.now();
  brakeLog('decide');
  showBrake('closed', title);
  closeApp();
}

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'jName') {
    J.name = el.value;
    const b = $('#jNameNext');
    if (b) b.disabled = !J.name.trim();
    return;
  }
  if (el.id === 'newApp') { NEWAPP.name = el.value; return; }
  if (el.id === 'appSearch') { APPSEARCH = el.value; const l = $('#installedList'); if (l) l.innerHTML = installedListHTML(); return; }
  if (el.dataset.money) {
    const digits = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 10);
    const n = digits ? Number(digits) : 0;
    el.value = digits ? n.toLocaleString('ko-KR') : '';
    S.settings[el.dataset.money] = n;
    if (el.dataset.money === 'weeklyLimit') snapshotWeekLimit();
  } else if (el.dataset.hours) {
    let v = el.value.replace(/[^\d.]/g, '');
    const parts = v.split('.');
    if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
    if (v !== el.value) el.value = v;
    const n = Math.min(168, parseFloat(v) || 0);
    S.settings[el.dataset.hours] = n;
  } else if (el.dataset.q !== undefined && el.dataset.c) {
    const cs = S.settings.cats[el.dataset.c];
    const i = Number(el.dataset.q);
    if (!cs || !cs.q[i]) return;
    cs.q[i][el.dataset.k] = el.value;
  } else return;
  save();
  const wb = $('#wageBox');
  if (wb) wb.innerHTML = wageBoxHTML();
});

  quick: (el) => openQuick(el.dataset.cat),
  key: (el) => pressKey(el.dataset.k),
  chip: (el) => addChip(Number(el.dataset.v)),
  qSave: saveQuick,
  toggleSpends: () => { UI.showSpends = !UI.showSpends; renderHome(); },
  dimClose: () => { if (layers[layers.length - 1] === 'sheet') closeSheet(); },
  sheetClose: () => closeSheet(),
  toastAct: () => { const f = toastFn; hideToast(); if (f) f(); },

  spendItem: (el) => {
    const x = S.spends.find((s) => s.id === el.dataset.id);
    if (!x) return;
    const c = catOf(x.cat);
    openSheet(`<div class="stitle">${c.emoji} ${c.label} ${won(x.amount)}</div>
      <div class="sdesc">${DAYS[new Date(x.at).getDay()]}요일 ${timeLabel(x.at)}에 기록했어요</div>
      <div class="btn-col"><button class="btn btn-danger" data-act="delSpend" data-id="${x.id}">기록 삭제하기</button>
      <button class="btn btn-light" data-act="sheetClose">닫기</button></div>`);
  },
  delSpend: (el) => {
    const x = S.spends.find((s) => s.id === el.dataset.id);
    if (!x) return;
    S.spends = S.spends.filter((s) => s.id !== x.id);
    save(); closeSheet(); renderHome();
    toast('기록을 삭제했어요', { label: '되돌리기', fn: () => { S.spends.push(x); save(); renderHome(); } });
  },

  waitItem: (el) => {
    const it = S.items.find((x) => x.id === el.dataset.id);
    if (!it) return;
    const left = it.waitUntil - Date.now();
    if (left <= 0) { recheckDismissed = false; openRecheck(it.id); return; }
    openSheet(`<div class="stitle">${esc(it.name)}</div>
      <div class="sdesc num">${won(it.price)} · ${remainLabel(left)} (${esc(whenLabel(it.waitUntil))}에 다시 물어봐요)</div>
      <div class="btn-col">
        <button class="btn btn-primary" data-act="passNow" data-id="${it.id}">지금 안 사기로 할래요</button>
        <button class="btn btn-light" data-act="sheetClose">계속 기다릴게요</button>
        <button class="tbtn" style="color:var(--danger)" data-act="delItem" data-id="${it.id}">대기함에서 삭제</button>
      </div>`);
  },
  passNow: (el) => {
    const it = S.items.find((x) => x.id === el.dataset.id);
    if (!it) return;
    it.status = 'passed'; it.decidedAt = Date.now();
    save(); closeSheet(); renderHome();
    toast(`${won(it.price)} 아꼈어요`);
  },
  recItem: (el) => {
    const it = S.items.find((x) => x.id === el.dataset.id);
    if (!it) return;
    openSheet(`<div class="stitle">${esc(it.name)}</div>
      <div class="sdesc num">${won(it.price)} · ${it.status === 'passed' ? '참았어요' : '샀어요'} · ${esc(whenLabel(it.decidedAt))}</div>
      <div class="btn-col"><button class="btn btn-danger" data-act="delItem" data-id="${it.id}">기록 삭제하기</button>
      <button class="btn btn-light" data-act="sheetClose">닫기</button></div>`);
  },
  delItem: (el) => {
    const idx = S.items.findIndex((x) => x.id === el.dataset.id);
    if (idx < 0) return;
    const [it] = S.items.splice(idx, 1);
    const linked = S.spends.filter((x) => x.itemId === it.id); // 음식 판단에서 같이 들어간 주간 지출도 함께 삭제
    S.spends = S.spends.filter((x) => x.itemId !== it.id);
    save(); closeSheet(); renderHome();
    toast('기록을 삭제했어요', { label: '되돌리기', fn: () => { S.items.splice(idx, 0, it); S.spends.push(...linked); save(); renderHome(); } });
  },

  // 판단
  jClose: () => closeLayer('judge'),
  jBack: () => judgeBack(),
  jCat: (el) => {
    if (!JCATS[el.dataset.cat]) return;
    if (J.cat !== el.dataset.cat) { J.pad = { value: 0, fresh: false }; }
    J.cat = el.dataset.cat;
    J.step = 'name';
    renderJudge();
    focusName();
  },
  jNameNext: () => {
    if (!J || !J.name.trim()) return;
    J.step = 'price';
    document.activeElement && document.activeElement.blur();
    renderJudge();
  },
  jPriceNext: () => { if (J.pad.value) { J.step = 'q'; J.qi = 0; J.answers = []; renderJudge(); } },
  jAns: (el) => judgeAnswer(el.dataset.pass === '1'),
  jGiveUp: () => ACT.jPass(),
  jPass: () => { J.savedItem = addItem('passed'); J.step = 'passed'; buzz(); renderJudge(); renderHome(); },
  jBuy: () => {
    addItem('bought'); closeLayer('judge'); renderHome();
    if (ENTRY === 'brake') brakeFinish(jcat(J.cat).recToast.split(' · ')[0]);
    else toast(jcat(J.cat).recToast);
  },
  jToWait: () => {
    const it = addItem('waiting');
    closeLayer('judge'); renderHome();
    if (ENTRY === 'brake') brakeFinish(`${whenLabel(it.waitUntil)}에 다시 물어볼게요`);
    else toast(`대기함에 넣었어요 · ${whenLabel(it.waitUntil)}에 다시 물어볼게요`);
  },
  jDone: () => {
    closeLayer('judge');
    if (ENTRY === 'brake') brakeFinish(`${won(J.savedItem ? J.savedItem.price : 0)} 아꼈어요`);
  },

  // 다시 묻기
  rClose: () => { if (R && R.step === 'ask') recheckDismissed = true; closeLayer('recheck'); renderHome(); },
  rNext: () => recheckNext(),
  rNo: () => {
    const it = S.items.find((x) => x.id === R.id);
    if (!it) return;
    it.status = 'passed'; it.decidedAt = Date.now();
    save(); buzz(); renderHome();
    R.step = 'passed'; renderRecheck();
  },
  rYes: () => {
    const it = S.items.find((x) => x.id === R.id);
    if (!it) return;
    it.status = 'bought'; it.decidedAt = Date.now();
    recordWeekly(it);
    save(); renderHome();
    toast(jcat(it.cat).recToast);
    recheckNext();
  },
  rLater: () => {
    const it = S.items.find((x) => x.id === R.id);
    if (!it) return;
    it.waitUntil = Date.now() + catWait(it.cat) * 60000; it.postponed = (it.postponed || 0) + 1;
    save(); renderHome();
    toast(`${whenLabel(it.waitUntil)}에 다시 물어볼게요`);
    recheckNext();
  },

  // 설정
  sBack: () => settingsBack(),
  onbDone: () => finishOnboarding(),
  seg: (el) => {
    const k = el.dataset.k, v = Number(el.dataset.v);
    S.settings[k] = v;
    if (k === 'weekStart') snapshotWeekLimit();
    if (k === 'brakeCooldown') Platform.syncWatch();
    save(); renderSettings(); renderHome();
  },
  setCat: (el) => { if (JCATS[el.dataset.c]) { settingsCat = el.dataset.c; renderSettings(); } },
  setWait: (el) => {
    const k = el.dataset.c, v = Number(el.dataset.v);
    if (!JCATS[k] || !JCATS[k].waitOpts.includes(v)) return;
    S.settings.cats[k].wait = v;
    save(); renderSettings();
  },
  resetQ: (el) => {
    const k = el.dataset.c;
    if (!JCATS[k]) return;
    S.settings.cats[k].q = JCATS[k].q.map((q) => ({ ...q }));
    save(); renderSettings();
    toast(`${JCATS[k].short} 질문을 기본값으로 되돌렸어요`);
  },
  resetAll: () => {
    openSheet(`<div class="stitle">모든 기록을 지울까요?</div>
      <div class="sdesc">판단 기록, 소액 기록, 참은 돈, 설정이 모두 지워지고 되돌릴 수 없어요.</div>
      <div class="btn-col"><button class="btn btn-danger" data-act="resetAllYes">모두 지우기</button>
      <button class="btn btn-light" data-act="sheetClose">취소</button></div>`);
  },
  resetAllYes: () => {
    try { localStorage.removeItem(KEY); } catch (_) {}
    S = defaults();
    closeLayer('sheet');
    renderHome();
    settingsMode = 'onb';
    renderSettings();
    toast('모든 기록을 지웠어요');
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) f(el, e);
});

/* ---------- 시작 ---------- */
// 두 입구(app/brake)가 같은 저장소를 쓰므로, 앞으로 올 때마다 최신 데이터를 다시 읽음
function onVisible() {
  S = load();
  renderHome();
  if (BR.shown) renderBrake();
  if (layers.includes('guide')) renderGuide();
  // 네이티브 앱에서는 앞으로 오는 이유를 앱이 jamkkanLaunch()로 알려 주므로 여기서는 판단하지 않음
  if (ENTRY === 'brake') { if (!Platform.native) onBrakeOpen(); }
  else maybeRecheck();
}
// 네이티브 진입점: 앱이 이미 켜져 있을 때 감지된 앱 때문에 다시 앞으로 오면 호출됨
// info = { entry: 'brake' | 'app', pkg: '패키지명', label: '앱 이름' } (객체 또는 JSON 문자열)
window.jamkkanLaunch = function (info) {
  try { info = typeof info === 'string' ? JSON.parse(info) : (info || {}); } catch (_) { info = {}; }
  S = load();
  if (info.entry === 'brake') {
    ENTRY = 'brake';
    document.title = '잠깐만 브레이크';
    BR.src = info.pkg || info.label ? { pkg: info.pkg || '', label: info.label || '' } : null;
    renderHome();
    if (layers.includes('judge')) return; // 판단 도중이면 그대로 이어감
    for (const l of layers.slice().reverse()) if (l !== 'judge') { layers.splice(layers.indexOf(l), 1); showLayer(l, false); }
    onBrakeOpen();
  } else {
    ENTRY = 'app';
    document.title = '잠깐만';
    BR.src = null;
    if (BR.shown) hideBrake();
    renderHome();
    maybeRecheck();
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    recheckDismissed = false;
    // 브레이크 화면에서 그냥 다른 앱으로 가면(뒤로 가기·홈) '넘김'으로 보고 반복 실행을 막음
    if (ENTRY === 'brake' && BR.shown && BR.mode === 'ask' && !layers.length) {
      S.brake.lastPass = Date.now();
      brakeLog('away');
    }
  } else onVisible();
});
window.addEventListener('storage', (e) => {
  if (e.key !== KEY) return;
  S = load();
  renderHome();
  if (BR.shown && BR.mode === 'ask') renderBrake();
  if (layers.includes('guide')) renderGuide();
});
setInterval(() => { if (document.visibilityState === 'visible') renderHome(); }, 30000);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor); } catch (_) {}

function init() {
  snapshotWeekLimit();
  Platform.syncWatch();
  renderHome();
  updateThemeColor();
  if (!S.settings.onboarded) openSettings('onb');
  else if (ENTRY === 'brake') onBrakeOpen();
  else maybeRecheck();
}
init();

// 서비스 워커는 상위 폴더(/jamkkan/sw.js)에 하나만 두고 app·brake를 함께 관리
// (네이티브 앱이 파일을 직접 넣어 둔 경우엔 서비스 워커가 필요 없음)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !Platform.native) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {}); });
}
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
</script>
